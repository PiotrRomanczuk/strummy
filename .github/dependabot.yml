version: 2
updates:
  # Root app. Security updates already run regardless of this file (a GitHub
  # repo setting, not config) — this adds version-update PRs on top, which is
  # what was actually missing (README.md has claimed "weekly" since this
  # workflow's own docs were written, but the file never existed).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    target-branch: 'main'
    # TypeScript majors (5 → 7) break lint/build and sat open for two months (#755,
    # closed 2026-10-21). A major bump is a deliberate ticket, not a weekly PR.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    # One PR per week instead of up to five: every Dependabot PR costs a full CI
    # run on the serial runner. `next` and `eslint-config-next` move together —
    # #997 bumped eslint-config-next alone and lint broke (closed 2026-11-13).
    groups:
      next:
        patterns: ['next', 'eslint-config-next', '@next/*']
      minor-and-patch:
        update-types: ['minor', 'patch']
        exclude-patterns: ['next', 'eslint-config-next', '@next/*']

  # Second npm ecosystem in this repo (confirmed via existing Dependabot
  # security-update PR titles: "npm_and_yarn in /., /mcp/strummy-server for...").
  - package-ecosystem: 'npm'
    directory: '/mcp/strummy-server'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    target-branch: 'main'
    groups:
      all:
        update-types: ['minor', 'patch']

  # GitHub Actions versions (actions/checkout@v6 etc.) — not previously
  # covered by anything.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    target-branch: 'main'
    groups:
      actions:
        patterns: ['*']
