name: Nightly E2E

# The ONE deliberate exception to "no `schedule:`" (ci.yml:5, e2e.yml:20).
#
# Why it is allowed here and nowhere else:
#   - Every job runs on the self-hosted `e2e` runner on `uwh`. Billed minutes:
#     zero. The $200 incident behind that rule was about fanned-out BILLED
#     runners, and none of that applies to hardware you already own.
#   - It is a separate file precisely so ci.yml and e2e.yml keep their absolute
#     "never add a schedule here" rule intact and reviewable. Do not move a
#     scheduled job into either of them.
#
# What it does NOT get to do: skip the discipline. One workflow, one matrix
# axis (device project), a hard timeout per project, and a concurrency group
# that queues rather than piling up.
#
# ⚠ Scheduled workflows only fire from the DEFAULT branch. This file does
# nothing until it is merged to `main`.
#
# ⚠ Runner serialisation: the `e2e` runner executes one job at a time, on
# purpose (see e2e.yml's concurrency comment). This matrix therefore occupies
# it for roughly an hour. It is scheduled at 03:17 Europe/Warsaw so it has long
# finished before anyone opens a PR — do not move it into working hours, or
# PR-time e2e runs will queue behind it.
#
# Re-testing one project against a candidate fix: dispatch this workflow with
# `projects` set to a single name, e.g. `iPad Pro`. That runs one leg (~7 min
# instead of ~45) and leaves the tracking issue alone — the result comes back
# as the `nightly-report` artifact. Only the 01:17 schedule writes the issue.

on:
  schedule:
    # 01:17 UTC = 03:17 Europe/Warsaw (CEST) / 02:17 (CET). Off the :00 mark
    # deliberately: GitHub's scheduler is heavily congested on the hour and
    # delays cron dispatch by tens of minutes there.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      projects:
        description: 'Space-separated Playwright project names (default: the nightly set)'
        required: false
        default: ''
        # Resolved into matrix legs by the `select` job below, which is where
        # the matching semantics and their one sharp edge are documented.
        # An input that matches no project fails the run rather than quietly
        # running nothing.

concurrency:
  # Queue, never evict: a nightly run that is halfway through the matrix must
  # not be cancelled by a manual dispatch, or the report covers nothing.
  group: nightly-e2e
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Forks inherit workflow files. A fork's scheduled run would execute repo
  # code on `uwh` (which holds dev AND prod Supabase keys in
  # ~/.strummy-e2e/.env.local). `schedule` cannot come from a PR, so e2e.yml's
  # fork/dependabot guard has nothing to test here — the repository identity is
  # the whole check, and it is the reason every job below carries this `if:`.
  #
  # This job exists because the `projects` input cannot be applied where it was
  # first tried. On 2026-09-08 (#791) it was wired into the matrix job's own
  # `if:` as `contains(inputs.projects, matrix.project)` — but `matrix` is not
  # among the contexts available in `jobs.<id>.if`; only `github`, `inputs`,
  # `needs` and `vars` are. GitHub rejects the entire FILE for that, so from
  # that merge until this one the nightly did not run at all: every push
  # produced a zero-job startup-failure run and the 01:17 cron never fired
  # again. It was silent for a day because a workflow that never starts writes
  # no tracking issue, and the last report simply stayed open looking current.
  #
  # `actionlint` catches exactly this class of mistake in about a second. Run it
  # against this file after any edit:
  #   actionlint .github/workflows/nightly-e2e.yml
  # (It flags `runs-on: [self-hosted, e2e]` as an unknown label — that is the
  # runner's custom label and the one expected warning.)
  #
  # Filtering therefore has to happen BEFORE the matrix exists: this job emits
  # the leg list as JSON and `fromJson` expands it below.
  select:
    name: Select projects
    if: github.repository == 'PiotrRomanczuk/strummy'
    # ubuntu-latest, for the same reason `report` is: a few seconds of jq, no
    # database and none of the runner host's secrets. The "keep it off billed
    # runners" discipline is about the fanned-out Playwright legs, which stay
    # on `uwh`.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.pick.outputs.projects }}
    steps:
      - name: Resolve the matrix legs
        id: pick
        env:
          # Empty on `schedule` — the `inputs` context carries nothing outside a
          # dispatch, which is what makes the nightly unfilterable by
          # construction rather than by a guard someone has to keep correct.
          REQUESTED: ${{ inputs.projects }}
        run: |
          set -euo pipefail

          # The nightly set. Chromium-only, and that is not a compromise being
          # hidden: WebKit's system deps need sudo on this runner (see
          # playwright.config.ts), and these four are the ones carrying distinct
          # viewport/touch/UA emulation on the chromium engine. Adding a WebKit
          # project here turns the run red every night until someone runs
          # `npx playwright install --with-deps webkit` on `uwh`.
          all='["Desktop Chrome","iPhone SE","iPhone 17 Pro Max","iPad Pro"]'

          if [ -z "${REQUESTED// /}" ]; then
            echo "Full nightly set: $all"
            echo "projects=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Substring matching, as the input's description promises. None of the
          # four names is a substring of another, so that is exact enough today
          # — but adding a project whose name nests inside another (say "iPad
          # Pro 13") would make the shorter name select both. Rename rather than
          # nest if that comes up.
          # The element is bound to $p first on purpose: writing this as the
          # shorter `select($req | contains(.))` silently matches everything,
          # because the pipe rebinds `.` to $req and the test becomes
          # "does $req contain itself".
          selected=$(jq -c --arg req "$REQUESTED" \
            'map(select(. as $p | $req | contains($p)))' <<<"$all")

          # A typo used to select zero legs and leave `report` triaging nothing,
          # which reads exactly like a green run. Fail loudly instead.
          if [ "$(jq 'length' <<<"$selected")" -eq 0 ]; then
            echo "::error::No project matches '$REQUESTED'. Valid names: $all"
            exit 1
          fi

          echo "Selected: $selected"
          echo "projects=$selected" >> "$GITHUB_OUTPUT"

  matrix:
    name: ${{ matrix.project }}
    needs: [select]
    # `needs: [select]` would already skip this on a fork, since `select` is
    # skipped there. The guard is repeated anyway: it is what keeps repo code
    # off `uwh`, and that should not depend on reading another job's `if:`.
    if: github.repository == 'PiotrRomanczuk/strummy'
    runs-on: [self-hosted, e2e]
    timeout-minutes: 45
    strategy:
      # One project at a time: they all drive the SAME dev stack with fixed
      # fixture names and no per-run isolation, so two concurrent projects
      # would delete each other's rows mid-assertion.
      max-parallel: 1
      # A red project must not cancel the rest — the whole point of the run is
      # a complete picture by morning.
      fail-fast: false
      matrix:
        # The canonical project list, and the reasoning for it, live in the
        # `select` job above — it is the only place that can filter them.
        project: ${{ fromJson(needs.select.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Provision env from runner host
        run: cp "$HOME/.strummy-e2e/.env.local" .env.local

      - name: Drop the sibling jobs' checkouts
        run: rm -rf parity-check rls-check types-check replay-check bruno-check

      - name: Run E2E pipeline
        env:
          # 3400 keeps the nightly clear of both CI (3300) and manual runs
          # (3200), so a hung nightly server can never hijack a PR's port.
          E2E_PORT: '3400'
          E2E_PROJECT: ${{ matrix.project }}
        run: bash scripts/e2e-remote/remote-runner.sh

      # Per-project results, because the runner's shared workspace is reused
      # and the next matrix leg overwrites test-results/.
      #
      # test-results/server.log is the app server's own stdout, copied there by
      # remote-runner.sh, and it is the ONLY record of why a `next start` died
      # mid-suite. It was not collected, so when the iPad Pro leg lost its
      # server on 2026-08-29 — turning 89 tests into ERR_CONNECTION_REFUSED —
      # the evidence was overwritten by the next leg before anyone read it.
      #
      # It is copied out of `.e2e-remote/` rather than uploaded from there
      # because that directory is hidden, and upload-artifact skips hidden
      # paths unless `include-hidden-files` is set — it would have collected
      # nothing, silently, which is the failure mode this step exists to end.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.project }}
          path: |
            playwright-report
            test-results/results.json
            test-results/server.log
          retention-days: 14

  report:
    name: Triage and file report
    needs: [select, matrix]
    # `always()` so a red matrix still gets triaged — that is the entire point
    # of the run. But not when `select` itself failed: there are no legs and so
    # no artifacts, and a report built from nothing is indistinguishable from a
    # green night.
    if: >-
      always()
      && github.repository == 'PiotrRomanczuk/strummy'
      && needs.select.result == 'success'
    # ubuntu-latest: pure JSON parsing plus the issues API. No DB, no secrets
    # from the runner host — nothing that needs to be on `uwh`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download all project results
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          path: nightly-artifacts

      - name: Build triage report
        run: node scripts/ci/nightly-e2e-report.mjs nightly-artifacts > nightly-report.md

      # Only the nightly schedule is allowed to write the tracking issue.
      #
      # `nightly-e2e-issue.sh` reuses ONE issue: a red report replaces its body,
      # and a green report closes it. Both of those are correct for a run that
      # covered all four projects and catastrophic for one that did not — a
      # single-project dispatch that came back green would close the issue and
      # the fixer routine would then find nothing open and report the suite
      # green, while three failures sat there unreported. Now that `projects`
      # actually selects legs (see above), that is one typed word away, so the
      # guard goes in with it.
      #
      # A dispatch still builds the report and uploads it as an artifact below,
      # which is all a candidate fix needs: run one project, read the artifact.
      - name: Open or update the nightly issue
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-e2e-issue.sh nightly-report.md

      - name: Upload the report itself
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-report
          path: nightly-report.md
          retention-days: 30
