name: Nightly E2E

# Started from `uwh`, not by GitHub's `schedule:` — there is none in this file,
# and since 2026-11-16 that is on purpose (history below). The systemd user
# timers in `scripts/ops/nightly-e2e/` dispatch this workflow with a `kind`:
#
#   kind=nightly   03:17 Europe/Warsaw, every night. Full device matrix (~35 min
#                  of the runner) and the ONLY run that writes the `nightly-e2e`
#                  tracking issue.
#   kind=daytime   09:17 / 15:17 / 21:17, and only when `dev` or the dev
#                  schema changed since the last run (`trigger.sh` decides).
#                  Every test, Desktop Chrome only (~8 min). The report goes to
#                  the job summary and the `nightly-report` artifact; it must
#                  NOT touch the issue (a green single-project run would close
#                  it over three untested device legs — see `report` below).
#   kind=manual    a person re-testing a candidate fix (the default).
#
# Timers dispatch it on `dev` (since 2026-11-25): the suite runs against the
# dev stack, which holds dev's migrations, so it tests dev's code. On `main`
# it failed every night a migration sat on dev before reaching main.
#
# Every job runs on the self-hosted `e2e` runner on `uwh`. Billed minutes:
# zero. It stays a separate file so ci.yml and e2e.yml keep their absolute
# "never add a schedule here" rule intact and reviewable.
#
# What it does NOT get to do: skip the discipline. One workflow, one matrix
# axis (device project), a hard timeout per project, and a concurrency group
# that queues rather than piling up.
#
# ⚠ Runner serialisation: the `e2e` runner executes one job at a time, on
# purpose (see e2e.yml's concurrency comment), so the matrix shares it with
# every PR's e2e run. 03:17 is chosen so it has long finished before anyone
# opens a PR — do not move the nightly timer into working hours.
#
# Re-testing one project against a candidate fix: dispatch this workflow with
# `projects` set to a single name, e.g. `iPad Pro`. That runs one leg (~7 min
# instead of ~35) and leaves the tracking issue alone — the result comes back
# as the `nightly-report` artifact. Only kind=nightly writes the issue.

# ── Schedule history ─────────────────────────────────────────────────────────
# Removed 2026-10-11 (owner decision, process audit §6): with no active users
# the nightly matrix only burned an hour of the runner and produced issues
# nobody triaged. Restored 2026-10-20 (owner decision) as four crons: the full
# matrix at 01:17 UTC and Desktop Chrome at 07:17 / 13:17 / 19:17 UTC.
#
# Moved to timers on `uwh` 2026-11-16, for two measured reasons:
#   - GitHub started those crons 5–8 hours late, every day. The "night" matrix
#     began around 08:30 Warsaw and on 2026-11-16 interleaved with PR runs
#     until 11:53 — after the 10:00 dev agent that is meant to read its report.
#   - The three daytime runs re-tested a commit that had not changed: `main`
#     stood on one SHA for two days and got the whole suite six times. Every
#     change to `main` has already passed e2e on its PR against this same dev
#     stack, so a rerun can only find flakiness — or a dev schema edited by
#     hand, which is why the schema is part of the key `trigger.sh` compares.
run-name: Nightly E2E · ${{ inputs.kind }}${{ inputs.key && format(' · {0}', inputs.key) || '' }}

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'nightly / daytime are for the uwh timers; a person leaves this on manual'
        type: choice
        options: [manual, nightly, daytime]
        default: manual
      key:
        description: 'What a timer run tested: <dev sha>-<dev schema hash> (set by trigger.sh)'
        required: false
        default: ''
        # Shown in the run name, which is where trigger.sh looks to decide
        # whether this state of dev + dev schema has been tested already.
      projects:
        description: 'manual only — space-separated Playwright project names (default: the nightly set)'
        required: false
        default: ''
        # Resolved into matrix legs by the `select` job below, which is where
        # the matching semantics and their one sharp edge are documented.
        # An input that matches no project fails the run rather than quietly
        # running nothing.

concurrency:
  # Queue, never evict: a nightly run that is halfway through the matrix must
  # not be cancelled by a manual dispatch, or the report covers nothing.
  group: nightly-e2e
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Forks inherit workflow files. A fork's run would execute repo code on `uwh`
  # (which holds dev AND prod Supabase keys in ~/.strummy-e2e/.env.local). A
  # dispatch cannot come from a PR, so e2e.yml's fork/dependabot guard has
  # nothing to test here — the repository identity is the whole check, and it
  # is the reason every job below carries this `if:`.
  #
  # This job exists because the `projects` input cannot be applied where it was
  # first tried. On 2026-09-08 (#791) it was wired into the matrix job's own
  # `if:` as `contains(inputs.projects, matrix.project)` — but `matrix` is not
  # among the contexts available in `jobs.<id>.if`; only `github`, `inputs`,
  # `needs` and `vars` are. GitHub rejects the entire FILE for that, so from
  # that merge until this one the nightly did not run at all: every push
  # produced a zero-job startup-failure run and the nightly never fired
  # again. It was silent for a day because a workflow that never starts writes
  # no tracking issue, and the last report simply stayed open looking current.
  #
  # `actionlint` catches exactly this class of mistake in about a second. Run it
  # against this file after any edit:
  #   actionlint .github/workflows/nightly-e2e.yml
  # (It flags `runs-on: [self-hosted, e2e]` as an unknown label — that is the
  # runner's custom label and the one expected warning.)
  #
  # Filtering therefore has to happen BEFORE the matrix exists: this job emits
  # the leg list as JSON and `fromJson` expands it below.
  select:
    name: Select projects
    if: github.repository == 'PiotrRomanczuk/strummy'
    # ubuntu-latest, for the same reason `report` is: a few seconds of jq, no
    # database and none of the runner host's secrets. The "keep it off billed
    # runners" discipline is about the fanned-out Playwright legs, which stay
    # on `uwh`.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.pick.outputs.projects }}
    steps:
      - name: Resolve the matrix legs
        id: pick
        env:
          KIND: ${{ inputs.kind }}
          REQUESTED: ${{ inputs.projects }}
        run: |
          set -euo pipefail
          # The timers' two kinds each mean one fixed set of legs. A `projects`
          # filter on top would let a one-leg run call itself the nightly and
          # write (or close) the issue, so the combination is refused.
          if [ "$KIND" != "manual" ] && [ -n "${REQUESTED// /}" ]; then
            echo "::error::'projects' only applies to kind=manual (got kind=$KIND)"
            exit 1
          fi

          # Daytime: the whole suite on one project. Only kind=nightly (the one
          # allowed to write the issue) and a manual dispatch get the matrix.
          if [ "$KIND" = "daytime" ]; then
            echo "Daytime run: Desktop Chrome only"
            echo 'projects=["Desktop Chrome"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The nightly set. Chromium-only, and that is not a compromise being
          # hidden: WebKit's system deps need sudo on this runner (see
          # playwright.config.ts), and these four are the ones carrying distinct
          # viewport/touch/UA emulation on the chromium engine. Adding a WebKit
          # project here turns the run red every night until someone runs
          # `npx playwright install --with-deps webkit` on `uwh`.
          all='["Desktop Chrome","iPhone SE","iPhone 17 Pro Max","iPad Pro"]'

          if [ -z "${REQUESTED// /}" ]; then
            echo "Full nightly set: $all"
            echo "projects=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Substring matching, as the input's description promises. None of the
          # four names is a substring of another, so that is exact enough today
          # — but adding a project whose name nests inside another (say "iPad
          # Pro 13") would make the shorter name select both. Rename rather than
          # nest if that comes up.
          # The element is bound to $p first on purpose: writing this as the
          # shorter `select($req | contains(.))` silently matches everything,
          # because the pipe rebinds `.` to $req and the test becomes
          # "does $req contain itself".
          selected=$(jq -c --arg req "$REQUESTED" \
            'map(select(. as $p | $req | contains($p)))' <<<"$all")

          # A typo used to select zero legs and leave `report` triaging nothing,
          # which reads exactly like a green run. Fail loudly instead.
          if [ "$(jq 'length' <<<"$selected")" -eq 0 ]; then
            echo "::error::No project matches '$REQUESTED'. Valid names: $all"
            exit 1
          fi

          echo "Selected: $selected"
          echo "projects=$selected" >> "$GITHUB_OUTPUT"

  matrix:
    name: ${{ matrix.project }}
    needs: [select]
    # `needs: [select]` would already skip this on a fork, since `select` is
    # skipped there. The guard is repeated anyway: it is what keeps repo code
    # off `uwh`, and that should not depend on reading another job's `if:`.
    if: github.repository == 'PiotrRomanczuk/strummy'
    runs-on: [self-hosted, e2e]
    timeout-minutes: 45
    strategy:
      # One project at a time: they all drive the SAME dev stack with fixed
      # fixture names and no per-run isolation, so two concurrent projects
      # would delete each other's rows mid-assertion.
      max-parallel: 1
      # A red project must not cancel the rest — the whole point of the run is
      # a complete picture by morning.
      fail-fast: false
      matrix:
        # The canonical project list, and the reasoning for it, live in the
        # `select` job above — it is the only place that can filter them.
        project: ${{ fromJson(needs.select.outputs.projects) }}
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Provision env from runner host
        run: cp "$HOME/.strummy-e2e/.env.local" .env.local

      - name: Drop the sibling jobs' checkouts
        run: rm -rf parity-check rls-check types-check replay-check bruno-check

      # The runner's workspace is REUSED (`clean: false` above, deliberately —
      # a fresh clone per leg would re-run `npm ci` four times a night). Nothing
      # else clears these two directories, and Playwright only clears its own
      # `outputDir` once it actually starts.
      #
      # So a leg that dies BEFORE `npx playwright test` — a failed `npm ci`,
      # build, or dev-stack check — leaves the previous run's results in place,
      # and the upload step below collects them as if they were this leg's. On
      # 2026-10-05 the Desktop Chrome leg died that way and uploaded an iPad Pro
      # `error-context.md` from the night before; the triage job parsed that
      # stale results.json, found nothing failing in it, and reported the whole
      # night green while the matrix was red.
      #
      # Removing them makes a leg that never ran report NOTHING, which the
      # triage job now recognises as an incomplete run rather than a pass.
      - name: Clear the previous run's results
        run: rm -rf test-results playwright-report

      - name: Run E2E pipeline
        env:
          # 3400 keeps the nightly clear of both CI (3300) and manual runs
          # (3200), so a hung nightly server can never hijack a PR's port.
          E2E_PORT: '3400'
          E2E_PROJECT: ${{ matrix.project }}
        run: bash scripts/e2e-remote/remote-runner.sh

      # The DOM at the moment of failure, into the JOB LOG — not only into an
      # artifact.
      #
      # Every triage pass on the iPad Pro failures since 2026-09-06 has stalled
      # on the same wall. The call log says an unidentified `<div>…</div>`
      # intercepted the click, and the one artefact that would name that element
      # is the Playwright trace. Artifact downloads redirect to
      # `*.blob.core.windows.net`, which the cloud container the triage routine
      # runs in cannot reach — verified 2026-09-08: `CONNECT tunnel failed,
      # response 403`, egress policy, with `GITHUB_TOKEN` present and the
      # metadata API answering 200. So no trace, screenshot or video is ever
      # readable from there, and no upload step can change that: they are binary
      # artefacts on a blocked host.
      #
      # Job logs ARE readable over the API, and Playwright already writes an
      # ARIA snapshot of the page for every failed attempt (`error-context.md`,
      # referenced by the reporter and then left on disk). Printing it here is
      # what turns "an attribute-less div intercepts pointer events" into a named
      # element, and it is the only diagnostic channel this run has that a fixer
      # pass can actually read.
      #
      # Capped per file: one dashboard snapshot runs to a few hundred lines and
      # there is one per retry, which is worth reading and not worth an unbounded
      # log.
      - name: Dump failure DOM snapshots into the log
        if: failure()
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          found=0
          for f in test-results/**/error-context.md; do
            found=1
            total=$(wc -l <"$f")
            echo "::group::$f ($total lines)"
            head -n 400 "$f"
            if [ "$total" -gt 400 ]; then
              echo "… truncated at 400 of $total lines"
            fi
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "No error-context.md found — the failure happened outside a test body (server death, config error)."
          fi

      # Per-project results, because the runner's shared workspace is reused
      # and the next matrix leg overwrites test-results/.
      #
      # test-results/server.log is the app server's own stdout, copied there by
      # remote-runner.sh, and it is the ONLY record of why a `next start` died
      # mid-suite. It was not collected, so when the iPad Pro leg lost its
      # server on 2026-08-29 — turning 89 tests into ERR_CONNECTION_REFUSED —
      # the evidence was overwritten by the next leg before anyone read it.
      #
      # It is copied out of `.e2e-remote/` rather than uploaded from there
      # because that directory is hidden, and upload-artifact skips hidden
      # paths unless `include-hidden-files` is set — it would have collected
      # nothing, silently, which is the failure mode this step exists to end.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.project }}
          path: |
            playwright-report
            test-results/results.json
            test-results/server.log
            test-results/**/error-context.md
          retention-days: 14

  report:
    name: Triage and file report
    needs: [select, matrix]
    # `always()` so a red matrix still gets triaged — that is the entire point
    # of the run. But not when `select` itself failed: there are no legs and so
    # no artifacts, and a report built from nothing is indistinguishable from a
    # green night.
    if: >-
      always()
      && github.repository == 'PiotrRomanczuk/strummy'
      && needs.select.result == 'success'
    # ubuntu-latest: pure JSON parsing plus the issues API. No DB, no secrets
    # from the runner host — nothing that needs to be on `uwh`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download all project results
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-*
          path: nightly-artifacts

      # NIGHTLY_EXPECTED_PROJECTS / NIGHTLY_MATRIX_RESULT are what let the
      # report tell "every leg passed" apart from "a leg never reported".
      # Without them it can only see the results that exist, which is how a red
      # matrix came to be summarised as `Verdict: green.`
      - name: Build triage report
        env:
          NIGHTLY_EXPECTED_PROJECTS: ${{ needs.select.outputs.projects }}
          NIGHTLY_MATRIX_RESULT: ${{ needs.matrix.result }}
        run: node scripts/ci/nightly-e2e-report.mjs nightly-artifacts > nightly-report.md

      # Only the nightly timer run is allowed to write the tracking issue.
      #
      # `nightly-e2e-issue.sh` reuses ONE issue: a red report replaces its body,
      # and a green report closes it. Both of those are correct for a run that
      # covered all four projects and catastrophic for one that did not — a
      # single-project dispatch that came back green would close the issue and
      # the fixer routine would then find nothing open and report the suite
      # green, while three failures sat there unreported. `select` refuses
      # `projects` on kind=nightly, so this condition does mean "all four legs".
      #
      # A dispatch still builds the report and uploads it as an artifact below,
      # which is all a candidate fix needs: run one project, read the artifact.
      # Every run — timer or manual — shows the report on its own
      # summary page, so nobody has to download an artifact to read it.
      - name: Publish the report to the job summary
        if: always()
        run: cat nightly-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the nightly issue
        if: inputs.kind == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/nightly-e2e-issue.sh nightly-report.md

      - name: Upload the report itself
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-report
          path: nightly-report.md
          retention-days: 30
