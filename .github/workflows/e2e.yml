name: E2E

# Runs the full Playwright suite on the self-hosted EliteDesk runner (label:
# e2e), next to the StudentDevelopment Supabase stack — zero billed minutes,
# no per-run stack bootstrap, persistent npm/browser caches.
#
# Cost & safety discipline (see ci.yml for the $200 backstory):
#   - NEVER a broad trigger: manual dispatch or PRs carrying the `e2e` label only
#   - no `schedule:`, no matrix — one job, Desktop Chrome only
#   - self-hosted runner executes repo code on a home machine: this is safe only
#     while the repo is private and solo — never enable fork PRs
#   - E2E_PORT 3300 keeps CI clear of manual runs (which use 3200)
#
# The `rls` job is the deliberate exception to the label gate. It needs the dev
# database (so it cannot live in ci.yml) but costs ~20s of free self-hosted
# time, and its entire value is catching identity/policy regressions the moment
# they land instead of whenever someone remembers to apply a label. Billed
# minutes: still zero.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Scoped PER PULL REQUEST, never one global group.
#
# This was `group: e2e-uwh` for everything, with cancel-in-progress. Because
# `pull_request` fires on EVERY PR — including ones whose jobs are skipped for
# lacking the `e2e` label — merely opening an unrelated PR joined the group and
# evicted a suite that was minutes from finishing. Observed 2026-07-29: opening
# #558 (a seed-script fix, e2e skipped) cancelled #557's running suite, which
# then reported as a red check.
#
# Cross-PR serialisation against the shared dev database still holds, because
# the self-hosted runner executes one job at a time. Register a second runner
# and that guarantee disappears — reinstate a shared group with
# `cancel-in-progress: false` (queue, don't evict) at that point.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: [self-hosted, e2e]
    timeout-minutes: 40
    steps:
      # clean: false keeps node_modules/.next/tests/.auth between runs — the
      # pipeline's own lockfile hash decides when npm ci re-runs.
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Provision env from runner host
        run: cp "$HOME/.strummy-e2e/.env.local" .env.local

      # The db-parity job checks out into this subdir of the shared workspace;
      # left in place, next build's type-check sweeps the nested repo copy
      # (tsconfig's mcp/ exclude doesn't match parity-check/mcp/).
      - name: Drop the sibling jobs' checkouts
        run: rm -rf parity-check rls-check

      - name: Run E2E pipeline
        env:
          E2E_PORT: '3300'
        run: bash scripts/e2e-remote/remote-runner.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/results.json
          retention-days: 14

  # The suite mutates data, so it only ever runs against the dev stack. This
  # job is what makes its green transferable: production must have an
  # identical public schema, or the E2E result says nothing about prod.
  db-parity:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: [self-hosted, e2e]
    timeout-minutes: 5
    steps:
      # Own subdirectory: a root checkout here would git-clean the e2e job's
      # shared workspace, wiping its npm and Next build caches.
      - uses: actions/checkout@v4
        with:
          path: parity-check
          clean: false

      - name: Compare production schema against development (read-only)
        working-directory: parity-check
        run: bash scripts/e2e-remote/check-db-parity.sh schema-parity.diff

      - name: Upload schema diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-parity-diff
          path: parity-check/schema-parity.diff
          retention-days: 14

  # The only automated tests that touch a real database. Every other suite in
  # the repo aliases @supabase/supabase-js to a mock, which cannot fail on an
  # RLS policy or on an id compared in the wrong space — the class of bug that
  # reached production twice in July 2026.
  #
  # Unlabelled by design (see the header): ~20s, free, runs on every PR.
  rls:
    runs-on: [self-hosted, e2e]
    timeout-minutes: 10
    steps:
      # Own subdirectory for the same reason as db-parity: a root checkout
      # would git-clean the e2e job's shared workspace.
      - uses: actions/checkout@v4
        with:
          path: rls-check
          clean: false

      # Credentials live on the runner, never in the repo. `.env.local` also
      # supplies the dev-stack URL; readRlsEnv() throws on a prod-shaped one.
      - name: Provision env from runner host
        working-directory: rls-check
        run: cp "$HOME/.strummy-e2e/.env.local" .env.local

      # node_modules persists between runs (clean: false), so reinstall only
      # when the lockfile actually moves — same trick as remote-runner.sh.
      - name: Install dependencies if the lockfile changed
        working-directory: rls-check
        run: |
          HASH=$(md5sum package-lock.json | cut -d' ' -f1)
          if [ ! -f node_modules/.package-lock.json ] || [ "$(cat .rls-lock-hash 2>/dev/null)" != "$HASH" ]; then
            npm ci --no-audit --no-fund
            echo "$HASH" > .rls-lock-hash
          fi

      - name: RLS suites (real PostgREST, real policies)
        working-directory: rls-check
        run: npm run test:rls
