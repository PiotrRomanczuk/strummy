name: E2E

# Runs the full Playwright suite on the self-hosted EliteDesk runner (label:
# e2e), next to the StudentDevelopment Supabase stack — zero billed minutes,
# no per-run stack bootstrap, persistent npm/browser caches.
#
# Two self-hosted runners live on that same box:
#   - `e2e` — the original. e2e/db-parity/rls land here because they mutate
#     the shared dev stack (fixed fixture names, no per-run isolation) and
#     share one checkout workspace/port. Stays serialized to one job at a
#     time on purpose — see the concurrency comment below.
#   - `e2e-light` — added 2026-08-02 so detect/types-drift (read-only, no
#     checkout mutation, no DB writes) never queue behind a 6-minute e2e run
#     from an unrelated PR. Safe to add more read-only jobs here; never move
#     anything that writes to the dev stack onto it.
#
# Cost & safety discipline (see ci.yml for the $200 backstory):
#   - NEVER a broad trigger: manual dispatch, the `e2e` label, or the `detect`
#     job classifying the diff as risky (auth/schema/e2e-infra paths) — never
#     "every PR" unconditionally
#   - no `schedule:`, no matrix — one job, Desktop Chrome only
#   - E2E_PORT 3300 keeps CI clear of manual runs (which use 3200)
#
# ⚠ This repo is PUBLIC. Every self-hosted job below executes repo code on
# `uwh` (a home machine holding dev AND prod Supabase keys in
# ~/.strummy-e2e/.env.local), so none of them may ever run for a fork PR or a
# Dependabot PR. The `guard` job below is the enforcement point: it sets
# `trusted=false` for both cases, and every self-hosted job requires
# `needs.guard.outputs.trusted == 'true'`. A skipped required check reports as
# neutral (= passing) for branch protection — do not add a new self-hosted job
# here without the same `needs: [guard]` + `if:` guard, or it silently reopens
# this hole. Layer 2 of the defense (repo setting: Settings → Actions →
# General → require approval for all outside collaborators) should also be on;
# this job-level guard is what still holds if that setting is ever changed.
#
# The `rls` job is the deliberate exception to the label gate. It needs the dev
# database (so it cannot live in ci.yml) but costs ~20s of free self-hosted
# time, and its entire value is catching identity/policy regressions the moment
# they land instead of whenever someone remembers to apply a label. Billed
# minutes: still zero.
on:
  workflow_dispatch:
  push:
    branches: [main, production]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Scoped PER PULL REQUEST, never one global group.
#
# This was `group: e2e-uwh` for everything, with cancel-in-progress. Because
# `pull_request` fires on EVERY PR — including ones whose jobs are skipped for
# lacking the `e2e` label — merely opening an unrelated PR joined the group and
# evicted a suite that was minutes from finishing. Observed 2026-07-29: opening
# #558 (a seed-script fix, e2e skipped) cancelled #557's running suite, which
# then reported as a red check.
#
# Cross-PR serialisation against the shared dev database still holds, because
# the self-hosted runner executes one job at a time. Register a second runner
# and that guarantee disappears — reinstate a shared group with
# `cancel-in-progress: false` (queue, don't evict) at that point.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether self-hosted jobs in this workflow may run at all. Runs on
  # ubuntu-latest DELIBERATELY — it decides whether self-hosted may be used,
  # so it cannot itself run there. See the header comment for why this exists.
  guard:
    name: Trusted source (e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - id: check
        env:
          # Fork: head repo differs from this repo. Dependabot: head repo is
          # OURS (branches live in this repo), so the fork test alone would
          # pass it through — excluded separately by actor, because a version
          # bump means running a new package's postinstall script on `uwh`.
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$IS_FORK" = "true" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "trusted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Untrusted source — self-hosted jobs in this workflow will be skipped."
          else
            echo "trusted=true" >> "$GITHUB_OUTPUT"
          fi

  # Decides whether this PR's diff touches paths risky enough to warrant the
  # full suite without anyone remembering the `e2e` label. Gates the jobs
  # DIRECTLY on the output rather than applying the label: labels added with
  # GITHUB_TOKEN do not fire `labeled` events (Actions' recursion guard), so a
  # label applied mid-run would never start the suite it was meant to start.
  # The manual label remains as an override for anything the list misses.
  detect:
    needs: [guard]
    if: github.event_name == 'pull_request' && needs.guard.outputs.trusted == 'true'
    # Read-only (lists PR files via the API, no checkout, no DB) — runs on the
    # e2e-light runner (a second self-hosted instance on the same box, its own
    # workspace) so it never queues behind a heavy e2e/db-parity run on the
    # main e2e runner.
    runs-on: [self-hosted, e2e-light]
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      risky: ${{ steps.diff.outputs.risky }}
    steps:
      - name: Classify changed paths
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate -q '.[].filename')
          echo "$files" | head -50
          if echo "$files" | grep -qE '^(supabase/migrations/|lib/auth/|lib/supabase/|app/\(auth\)/|app/auth/|app/api/auth/|tests/e2e/|scripts/e2e-remote/|playwright)|^proxy\.ts$|^types/database\.types\.ts$|^\.github/workflows/e2e\.yml$'; then
            echo "risky=true" >> "$GITHUB_OUTPUT"
            echo "Risky paths touched — full suite will run."
          else
            echo "risky=false" >> "$GITHUB_OUTPUT"
            echo "No risky paths — suite stays label-gated."
          fi

  e2e:
    name: E2E (Desktop Chrome)
    needs: [guard, detect]
    # `always()` because detect is skipped on workflow_dispatch and push, and a
    # skipped dependency would otherwise skip this job before its own
    # condition is read. `needs.guard.outputs.trusted` MUST sit outside the
    # parenthesised OR below — inside it, a bare `push` event would satisfy
    # the whole expression and bypass the guard entirely.
    #
    # `push` is listed explicitly. Without it this job could NEVER run on a push
    # to main/production despite the trigger above saying it does: `detect` only
    # runs for `pull_request`, so on a push all three original conditions are
    # false and the job silently skipped. Main therefore reported the E2E
    # workflow green while running nothing but rls/types-drift — which is how
    # songs-crud and teacher-full-journey stayed red for days without anyone
    # seeing it (fixed in this PR).
    #
    # Cost: zero billed minutes — this is the self-hosted EliteDesk runner. The
    # real cost is ~6 min of that runner per merge to main, and PR suites queue
    # behind it because the runner is serial. That is the trade being made: the
    # branch that deploys to production is worth a queue slot.
    #
    # ⚠ KNOW THIS BEFORE RELYING ON THE `push` ARM: it almost never fires.
    # auto-merge.yml merges with GITHUB_TOKEN as app/github-actions, and Actions'
    # recursion guard means such pushes trigger NO workflow runs at all — the
    # same guard the `detect` job notes for `labeled` events. Verified
    # 2026-07-31: of the four most recent merges to main, only #615 (merged by a
    # human) produced a push run; #614, #616 and #618 produced none. `ci.yml`
    # declares the same `push: [main, production]` trigger and is equally inert.
    #
    # Vercel is NOT subject to this — it deploys via its own GitHub App, so a
    # bot-merged commit reaches production while zero workflows run. The deploy
    # fires and the tests do not.
    #
    # So the real gate is PR-time, which is why main now requires branches to be
    # up to date before merging (branch protection, `strict: true`, set
    # 2026-08-01): it forces the PR to contain current main, making the PR-time
    # green a statement about the merged result. This arm stays because it costs
    # nothing and becomes live the moment a merge is made by a human, by
    # workflow_dispatch, or with a PAT/App token.
    if: >
      always() && needs.guard.outputs.trusted == 'true' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.pull_request.labels.*.name, 'e2e') ||
        needs.detect.outputs.risky == 'true'
      )
    runs-on: [self-hosted, e2e]
    timeout-minutes: 40
    steps:
      # clean: false keeps node_modules/.next/tests/.auth between runs — the
      # pipeline's own lockfile hash decides when npm ci re-runs.
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Provision env from runner host
        run: cp "$HOME/.strummy-e2e/.env.local" .env.local

      # db-parity and rls check out into subdirs of this SHARED workspace (a
      # self-hosted runner reuses _work/<repo>/<repo> across every branch and
      # PR), so a sibling job's copy can outlive its run and land inside this
      # build's type-check. tsconfig now excludes both paths — belt — and this
      # removes them anyway so the workspace doesn't accumulate — braces.
      - name: Drop the sibling jobs' checkouts
        run: rm -rf parity-check rls-check types-check replay-check bruno-check

      - name: Run E2E pipeline
        env:
          E2E_PORT: '3300'
        run: bash scripts/e2e-remote/remote-runner.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results/results.json
          retention-days: 14

  # The suite mutates data, so it only ever runs against the dev stack. This
  # job is what makes its green transferable: production must have an
  # identical public schema, or the E2E result says nothing about prod.
  #
  # Ungated (2026-08-05): this used to be gated the same way as `e2e` (label /
  # risky-path / dispatch), but that `if:` never included a `push` arm — so it
  # could NEVER run on `main`, and that is exactly how a 67-line prod/dev
  # schema drift accumulated unnoticed. It's read-only and takes seconds, so
  # there's no cost reason to gate it; it now runs on every trusted trigger.
  db-parity:
    needs: [guard]
    if: needs.guard.outputs.trusted == 'true'
    runs-on: [self-hosted, e2e]
    timeout-minutes: 5
    steps:
      # Own subdirectory: a root checkout here would git-clean the e2e job's
      # shared workspace, wiping its npm and Next build caches.
      - uses: actions/checkout@v6
        with:
          path: parity-check
          clean: false

      - name: Compare production schema against development (read-only)
        working-directory: parity-check
        run: bash scripts/e2e-remote/check-db-parity.sh schema-parity.diff

      - name: Upload schema diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-parity-diff
          path: parity-check/schema-parity.diff
          retention-days: 14

  # Read-only report: is QA/test-account activity drifting into
  # StudentProduction? (Prompted by the 2026-08-05 manual DB audit that found
  # undocumented plus-alias test students accumulating real-looking lesson
  # data in prod.) NEVER deletes anything and NEVER fails the build — this is
  # a report, not a gate, same spirit as lighthouse-ci's advisory checks.
  # Findings (including the one case that should never happen — a
  # dev-flagged profile in prod) land in the job summary; act on them by hand.
  test-data-report:
    name: Test-data hygiene report
    needs: [guard]
    if: needs.guard.outputs.trusted == 'true'
    runs-on: [self-hosted, e2e-light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          path: test-data-check
          clean: false

      - name: Report test-data drift (read-only)
        working-directory: test-data-check
        run: |
          bash scripts/e2e-remote/check-test-data.sh test-data-report.txt
          cat test-data-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-data-report
          path: test-data-check/test-data-report.txt
          retention-days: 14

  # db-parity proves prod == dev; types-drift proves the generated types == dev.
  # Neither notices a schema change made ad-hoc through psql or Studio and never
  # filed as a migration: it sits in dev, gets copied to prod, shows up in the
  # types, and is simply absent from the repo — invisible until someone builds a
  # database from scratch. This job replays supabase/migrations into a throwaway
  # database inside the dev container and diffs the result against dev, closing
  # the third side of that triangle (migrations == dev).
  #
  # Read-only with respect to both stacks (its scratch database is dropped on
  # exit), so it is ungated for the same reason as db-parity: gating it behind a
  # label means catching drift whenever someone remembers, which is not catching
  # it. Runs on `e2e-light` — it writes only to its own database, so it does not
  # need the serialized main runner.
  migrations-replay:
    needs: [guard]
    if: needs.guard.outputs.trusted == 'true'
    runs-on: [self-hosted, e2e-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: replay-check
          clean: false

      - name: Replay supabase/migrations into a scratch DB and diff against dev
        working-directory: replay-check
        run: bash scripts/e2e-remote/check-migrations-replay.sh migration-replay.diff

      - name: Upload replay diff and psql log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-replay-diff
          path: |
            replay-check/migration-replay.diff
            replay-check/migration-replay.log
          retention-days: 14

  # The only automated tests that touch a real database. Every other suite in
  # the repo aliases @supabase/supabase-js to a mock, which cannot fail on an
  # RLS policy or on an id compared in the wrong space — the class of bug that
  # reached production twice in July 2026.
  #
  # Unlabelled by design (see the header): ~20s, free, runs on every PR.
  # Generated DB types must match the live schema. Lives here, not ci.yml,
  # because it needs the dev database — same rationale (and cost: zero) as the
  # rls job above. Ungated for the same reason: the failure it catches is a
  # silent runtime 42703, and catching it whenever someone remembers a label
  # is not catching it.
  types-drift:
    name: DB types drift
    needs: [guard]
    if: needs.guard.outputs.trusted == 'true'
    # Read-only schema introspection, no repo mutation — runs on the
    # e2e-light runner (own workspace) alongside `detect`, so it doesn't
    # queue behind e2e/db-parity/rls on the main runner. Docker access to
    # supabase_db_StudentDevelopment is host-level, so this still reaches the
    # same dev stack from the second runner instance.
    runs-on: [self-hosted, e2e-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          clean: false

      - name: Regenerate types from the dev schema and diff against the commit
        run: npm run db:types:check

  # API-contract smoke against the 178-request Bruno collection (bruno/strummy/),
  # GET-only (see --get-only in run-bruno.sh) so it never mutates the shared dev
  # stack that e2e/rls also depend on. This is the layer nothing else in the repo
  # covers: unit tests mock @supabase/supabase-js entirely, so they can't catch a
  # wrong response shape, a broken route, or a missing header — only a real HTTP
  # round-trip against a real server does.
  #
  # Runs on e2e-light despite needing a full build+start (heavier than its
  # sibling jobs there): GET-only means it never writes, so it doesn't need to
  # serialize against the main e2e runner's shared, mutating dev-stack session.
  # Own port (3400): 3000/3200/3300 already belong to another app / manual runs
  # / the e2e job.
  bruno:
    needs: [guard]
    if: needs.guard.outputs.trusted == 'true'
    runs-on: [self-hosted, e2e-light]
    timeout-minutes: 15
    steps:
      # Own subdirectory: a root checkout would git-clean the e2e job's shared
      # workspace, wiping its npm and Next build caches.
      - uses: actions/checkout@v6
        with:
          path: bruno-check
          clean: false

      # Credentials live on the runner, never in the repo — same pattern as rls.
      - name: Provision env from runner host
        working-directory: bruno-check
        run: cp "$HOME/.strummy-e2e/.env.local" .env.local

      - name: Install dependencies if the lockfile changed
        working-directory: bruno-check
        run: |
          HASH=$(md5sum package-lock.json | cut -d' ' -f1)
          if [ ! -f node_modules/.package-lock.json ] || [ "$(cat .bruno-lock-hash 2>/dev/null)" != "$HASH" ]; then
            npm ci --no-audit --no-fund
            echo "$HASH" > .bruno-lock-hash
          fi

      - name: Build and start
        working-directory: bruno-check
        run: |
          npm run build
          setsid nohup npx next start -p 3400 > .bruno-server.log 2>&1 < /dev/null &
          disown
          curl --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
               -sf -o /dev/null http://localhost:3400/

      # --get-only guarantees no write ever reaches the shared dev stack.
      #
      # continue-on-error (2026-08-05): ~/.strummy-e2e/.env.local on this
      # runner has no ADMIN_EMAIL/TEACHER_EMAIL/STUDENT_EMAIL (+ password)
      # pairs — those live in CLAUDE.local.md, gitignored, and Playwright's
      # E2E auth gets them a different way (hardcoded in playwright.config.ts,
      # not sourced from this file). Without them run-bruno.sh's persona
      # sign-in fails and every auth-gated GET correctly 401s, which fails
      # that request's assertions — a runner-credential gap, not something
      # this job or a PR's code can fix. Verified 2026-08-05: the collection
      # itself runs fine (build+start succeeded, ~100 requests executed);
      # only auth-gated assertions fail. Flip this to hard-fail once
      # ADMIN_EMAIL/PASSWORD (+ teacher/student) are added to that file on
      # uwh — bru's own JSON report (uploaded below) still shows the results,
      # so this doesn't lose visibility, only merge-blocking.
      - name: Bruno GET-only smoke
        working-directory: bruno-check
        continue-on-error: true
        run: bash scripts/ci/run-bruno.sh local --get-only
        env:
          BRUNO_BASE_URL_OVERRIDE: 'http://localhost:3400'

      - name: Stop server
        if: always()
        run: fuser -k 3400/tcp 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bruno-results
          path: bruno-check/bruno-results-local.json
          retention-days: 14

  rls:
    name: RLS policies
    needs: [guard]
    if: needs.guard.outputs.trusted == 'true'
    runs-on: [self-hosted, e2e]
    timeout-minutes: 10
    steps:
      # Own subdirectory for the same reason as db-parity: a root checkout
      # would git-clean the e2e job's shared workspace.
      - uses: actions/checkout@v6
        with:
          path: rls-check
          clean: false

      # Credentials live on the runner, never in the repo. `.env.local` also
      # supplies the dev-stack URL; readRlsEnv() throws on a prod-shaped one.
      - name: Provision env from runner host
        working-directory: rls-check
        run: cp "$HOME/.strummy-e2e/.env.local" .env.local

      # node_modules persists between runs (clean: false), so reinstall only
      # when the lockfile actually moves — same trick as remote-runner.sh.
      - name: Install dependencies if the lockfile changed
        working-directory: rls-check
        run: |
          HASH=$(md5sum package-lock.json | cut -d' ' -f1)
          if [ ! -f node_modules/.package-lock.json ] || [ "$(cat .rls-lock-hash 2>/dev/null)" != "$HASH" ]; then
            npm ci --no-audit --no-fund
            echo "$HASH" > .rls-lock-hash
          fi

      - name: RLS suites (real PostgREST, real policies)
        working-directory: rls-check
        run: npm run test:rls
