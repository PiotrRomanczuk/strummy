name: CI

# Cost discipline (a previous Actions setup ran up a $200+ bill):
#   - main and PRs targeting main ONLY — no feature/** or fix/** push triggers
#   - no `schedule:` in this file, ever. Scheduled production jobs belong in
#     cron-jobs.yml, which stays deleted until the app returns to remote prod.
#   - no matrix: one Node version, one OS
#   - one job, one runner, one `npm ci` — the previous pipeline fanned the same
#     install across three jobs and paid for it three times
#   - concurrency cancels superseded runs on rapid pushes
#   - a hard timeout so nothing can hang a runner for six hours
#
# ⚠ The `push` trigger below is close to dead in practice. auto-merge.yml merges
# with GITHUB_TOKEN as app/github-actions, and Actions' recursion guard means
# such pushes trigger NO workflow runs — so a normal bot-merged PR produces no
# post-merge CI run at all. Verified 2026-07-31: of the four most recent merges
# to main only #615 (human-merged) produced one. Vercel still deploys, because
# it uses its own GitHub App and is not subject to the guard.
#
# main's green is therefore inherited from PR-time checks. That is why main
# requires branches to be up to date before merging (branch protection,
# `strict: true`, set 2026-08-01) — it forces the PR to contain current main so
# the PR-time run actually tests what lands. Do not add a post-merge-only check
# here and assume it runs.
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
    # Explicit types, not the default [opened, synchronize, reopened]:
    # `edited` is required so a stacked PR's checks actually run once its
    # base is auto-retargeted to main/production (GitHub fires `edited` for a
    # base-branch change, not `synchronize`). Found 2026-08-05: a PR opened
    # against an unmerged feature branch, then auto-retargeted to `main` when
    # that branch merged, never triggered this workflow at all — the
    # retarget event fell through both this default and e2e.yml's explicit
    # (but also `edited`-less) list, so "Lint, types, tests, build" (a
    # required check) never reported and the PR silently sat unmergeable.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, types, tests, build
    # ubuntu-latest — this repo is PUBLIC, so hosted-runner minutes are free
    # (verified via `gh repo view` → visibility: PUBLIC). A prior pass moved
    # this job to the self-hosted `e2e-light` runner assuming billed minutes
    # were the cost driver; they weren't, and self-hosted execution of
    # PR-supplied code on a public repo is a real risk instead (the runner
    # lives on `uwh`, which holds dev AND prod Supabase keys in
    # ~/.strummy-e2e/.env.local). Fork/Dependabot PRs are additionally kept off
    # self-hosted jobs entirely by the `guard` job below — but this job never
    # needed to be there in the first place. Moved back 2026-08-05.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Version-bump commits change only package.json; re-running the suite for
    # them buys nothing. (head_commit is null on pull_request, so PRs always run.)
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"

    env:
      # Fall back to inert placeholders so lint/typecheck/build never depend on
      # live credentials. Unit tests mock Supabase; anything needing a real
      # database is excluded via SKIP_DB_TESTS below.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-key' }}

    steps:
      # fetch-depth: 0 because the PR unit-test step uses --changedSince,
      # which needs the merge-base with origin/main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # .next/cache: only effective because next.config.ts sets
      # experimental.turbopackFileSystemCacheForBuild — without that flag
      # Turbopack persists nothing across processes and this cache is dead
      # weight. Key ends in github.sha so it can never hit exactly: an exact
      # primary-key hit makes actions/cache refuse to re-save at the end of
      # the job, which on run 30470324713 threw away the freshly-built 674 MB
      # Turbopack cache instead of updating it.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # eslint/tsc/jest incremental state. Same exact-key caveat as above, so
      # this key also ends in github.sha with a prefix restore-key fallback.
      - uses: actions/cache@v6
        with:
          path: |
            .eslintcache
            tsconfig.tsbuildinfo
            .jest-cache
          key: incremental-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: |
            incremental-${{ runner.os }}-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-

      - run: npm ci

      # Lint and type check are independent and each is effectively
      # single-threaded, so running them concurrently on this runner is free.
      # Deliberately NOT split into a second job: that would pay for another
      # checkout + `npm ci` in billed minutes, which is the exact fan-out the
      # cost note at the top of this file exists to prevent.
      #
      # Output goes to files and is replayed in collapsible groups afterwards —
      # interleaved stdout from two concurrent tools is unreadable, and a gate
      # whose failure you cannot attribute is barely a gate.
      # --cache-strategy content, not the default mtime: every checkout writes
      # fresh timestamps, so a metadata-keyed cache would never hit in CI.
      # tsc needs no flags — tsconfig.json already sets `incremental: true`,
      # which reads/writes tsconfig.tsbuildinfo (content-hashed, so it too
      # survives fresh checkouts).
      - name: Lint and type check (concurrent)
        id: checks
        run: |
          npm run lint -- --cache --cache-location .eslintcache --cache-strategy content > /tmp/lint.log 2>&1 & lint_pid=$!
          npm run typecheck > /tmp/tsc.log 2>&1 & tsc_pid=$!
          wait $lint_pid; lint_rc=$?
          wait $tsc_pid; tsc_rc=$?

          echo "::group::Lint output"; cat /tmp/lint.log; echo "::endgroup::"
          echo "::group::Type check output"; cat /tmp/tsc.log; echo "::endgroup::"

          [ $lint_rc -eq 0 ] || echo "::error title=Lint::eslint exited $lint_rc"
          [ $tsc_rc -eq 0 ] || echo "::error title=Type check::tsc exited $tsc_rc"
          # Explicit test rather than summing the codes: exit statuses are mod
          # 256, so two failures could sum to a deceptive 0.
          if [ $lint_rc -ne 0 ] || [ $tsc_rc -ne 0 ]; then exit 1; fi

      - name: Check project structure
        id: structure
        run: npm run check:structure:strict

      # Do NOT add --testPathIgnorePatterns to either step: the Jest CLI flag
      # REPLACES the config array rather than merging, which would wipe the
      # quarantine list in jest.config.ts and let rotted tests run.
      # (--maxWorkers is a scalar override and carries no such hazard.)
      #
      # Why two steps. Measured on run 30456166861: the suite took 390s of a
      # 624s job — 63% — while the identical 3,744 tests run in 17s locally.
      # Two causes, both addressed here:
      #   1. `--coverage` instruments every file and writes html + lcov +
      #      json-summary. PRs skip it; `main` still runs it, so the per-file
      #      100% locks on the core files are enforced before anything can
      #      regress there. TRADE-OFF: a coverage drop now surfaces on main
      #      rather than on the PR that caused it. Coverage failures don't
      #      break the app, and the alternative was paying ~6 min on every
      #      push — but if that lands too late for comfort, restore --coverage
      #      below with `--coverageReporters=text-summary`, which keeps the
      #      gate and drops only the expensive report writing.
      #   2. jest.config.ts sets `maxWorkers: '50%'`, tuned for an 8-core Mac.
      #      A hosted runner has 2-4 vCPUs, so 50% left Jest on one worker.
      # --changedSince=origin/main runs only the tests Jest's dependency graph
      # links (transitively) to the PR's diff — typically seconds instead of
      # ~50s. Two accepted gaps, both backstopped by the full suite + coverage
      # that still runs on every push to main:
      #   1. The graph tracks imports, not data: a test that fs.reads a
      #      fixture won't re-run when only the fixture changes.
      #   2. Zero affected tests is a clean pass by design ("No tests found
      #      related to changed files"), e.g. docs-only PRs.
      - name: Unit tests (pull request — affected by diff only)
        id: unit-pr
        if: github.event_name == 'pull_request'
        run: npx jest --ci --watchAll=false --maxWorkers=100% --changedSince=origin/main
        env:
          CI: true
          SKIP_DB_TESTS: true

      - name: Unit tests + coverage thresholds (main)
        id: unit-main
        if: github.event_name != 'pull_request'
        run: npm run test:ci -- --maxWorkers=100%
        env:
          CI: true
          SKIP_DB_TESTS: true

      - name: Integration tests
        id: integration
        run: npm run test:integration
        env:
          CI: true
          SKIP_DB_TESTS: true

      - name: Build
        id: build
        run: npm run build

      # One glance on the run's summary page instead of spelunking logs.
      # `steps.<id>.outcome` is the pre-continue-on-error result; a skipped
      # unit variant always means "the other event's variant ran", so it is
      # rendered as a dash rather than implying a gate was missed.
      - name: Write job summary
        if: always()
        run: |
          fmt() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "🚫";; *) echo "—";; esac; }
          {
            echo "## Quality gates"
            echo ""
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Lint + type check | $(fmt '${{ steps.checks.outcome }}') |"
            echo "| Structure check | $(fmt '${{ steps.structure.outcome }}') |"
            echo "| Unit (PR, no coverage) | $(fmt '${{ steps.unit-pr.outcome }}') |"
            echo "| Unit + coverage (main) | $(fmt '${{ steps.unit-main.outcome }}') |"
            echo "| Integration | $(fmt '${{ steps.integration.outcome }}') |"
            echo "| Build | $(fmt '${{ steps.build.outcome }}') |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Unused files/exports/dependencies. Complements check:structure's C5 (which
  # only catches files unimported by filename-stem AND edited in the last 60
  # days) with a real module-graph resolution: unused exports, unused
  # dependencies/devDependencies, unresolved imports, duplicate exports — none
  # of which C5 or C2 touch. Scoped to app/components/lib/hooks/schemas/types
  # (same as check-structure.sh's SRC_DIRS) via knip.json's `project`, so
  # scripts/ (CLI-invoked, not imported) and .claude/ (agent assets) don't
  # drown real findings in noise.
  #
  # --no-exit-code (2026-08-05, first introduction): first run found 152
  # unused files / 157 unused exports / 10 unlisted deps before scoping, and
  # even scoped there are real, valid findings (unused packages like `tone`,
  # `recharts` — confirmed zero import sites) that are still real cleanup
  # work, not code to gate a merge on yet. Same ratchet philosophy as
  # scripts/ci/.structure-baseline: land visible and non-blocking, flip to
  # failing (drop --no-exit-code) once a maintainer has triaged the current
  # findings and knip.json's ignores are tuned to them specifically.
  knip:
    name: Unused code (knip)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx knip --no-exit-code

  # Secret scanning against the full commit history, not just the diff — see
  # docs/runbooks/2026-08-05-gitleaks-history-audit.md for how that history
  # was triaged (220 findings, 219 false positives — jwt.io's canonical demo
  # token, Supabase's own public docs example project, `YOUR_KEY_HERE`-style
  # placeholders — and one real-but-expired session token, assessed as
  # inert). .gitleaks-baseline.json suppresses all 220 by fingerprint
  # (commit:file:rule:line), so this only ever flags something NEW reaching
  # any commit — same ratchet pattern as scripts/ci/.structure-baseline.
  # Regenerate the baseline (see the runbook) only after reviewing a genuine
  # new false positive; never to silence a real one.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Direct binary, pinned version — no third-party Action, matching the
      # rest of this file (only official actions/* used elsewhere). Version
      # matches the one used to generate .gitleaks-baseline.json locally
      # (2026-08-05); bump both together if the baseline is ever regenerated
      # against a newer release, since fingerprint format could change.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Scan full history against the baseline
        run: gitleaks detect --source . --baseline-path .gitleaks-baseline.json --redact

  # Perf/a11y/best-practices/SEO audit of the unauthenticated routes (landing,
  # login, locale root) via Lighthouse. quality-gates already proves `npm run
  # build` succeeds with these same placeholder Supabase env vars, and proxy.ts
  # middleware's supabase.auth.getUser() call fails DNS resolution against
  # 'example.supabase.co' in ~10ms (verified) rather than hanging — so serving
  # these routes needs no database and no live Supabase project.
  #
  # DO NOT PANIC AT THE PERFORMANCE NUMBER. Lighthouse's default
  # `throttlingMethod: simulate` does not report real wall-clock load time —
  # it MODELS a mid-range phone on throttled mobile (RTT 150ms, ~1.6 Mbps,
  # 4x CPU slowdown) from a trace of the actual (fast, local) load. Verified
  # 2026-08-05: the real HTML document loaded in 482ms against this placeholder
  # build, yet Lighthouse reported an 11-13s simulated LCP/TTI — and the SAME
  # simulated run against live strummy.online scored only 56/100 despite a
  # real Supabase backend answering instantly. A 40-70 performance score under
  # this model is normal for a Next.js app this size with no dedicated perf
  # tuning; it is not evidence of a regression, which is exactly why the
  # threshold in lighthouse-ci.sh is 40, not 90. Judge PR-to-PR deltas, not
  # the absolute number.
  #
  # ALWAYS advisory, never a required check: perf scores on a shared runner
  # vary run to run, and a real regression here doesn't break the app the way
  # a failing test does. PR-only — push is inert anyway (see ci.yml header),
  # and this is a per-PR delta signal, not something main needs to re-prove.
  #
  # ubuntu-latest ships Chrome stable (chrome-launcher, bundled in
  # lighthouse@^13, finds it with no setup step). Self-hosted was rejected:
  # whatever chromium Playwright's install left behind is an unmanaged
  # dependency for a check that has nothing to do with E2E.
  lighthouse-ci:
    name: Performance + a11y
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: 'https://example.supabase.co'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'mock-key'
      SUPABASE_SERVICE_ROLE_KEY: 'mock-key'
      # `next start` sets NODE_ENV=production, which trips validateEnv()'s
      # hard throw in instrumentation.ts for any of these three missing —
      # found by this job's own first hosted run: the server logged "Ready"
      # then failed every single request with "Missing required production
      # environment variables". quality-gates never hit this because it only
      # runs `npm run build` (compile-time), never `next start`. None of these
      # are exercised by an unauthenticated homepage audit — cron auth and
      # Gmail SMTP are both dead weight for what Lighthouse actually visits.
      CRON_SECRET: 'mock-secret'
      GMAIL_USER: 'mock@example.com'
      GMAIL_APP_PASSWORD: 'mock-password'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Separate key prefix (lh-) from quality-gates' nextjs- cache so the two
      # jobs' entries don't compete for space under the repo's cache quota.
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: lh-nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            lh-nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm ci
      - run: npm run build

      - name: Start server
        run: |
          setsid nohup npx next start -p 3000 > server.log 2>&1 < /dev/null &
          disown
          curl --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
               -sf -o /dev/null http://localhost:3000/ || {
            echo "::group::server.log"; cat server.log; echo "::endgroup::"
            exit 1
          }

      # Via `npm run`, not a direct `bash scripts/...` call: lighthouse-ci.sh
      # invokes the bare `lighthouse` binary, which only resolves because
      # `npm run` prepends node_modules/.bin to PATH. Calling the script
      # directly reproduces "lighthouse: command not found" (verified
      # locally) — an easy trap the script itself gives no hint about.
      #
      # continue-on-error: this job is ALWAYS advisory (see the header
      # comment) — a threshold failure here must not turn the job red the way
      # a real test failure does. Confirmed flaky in practice on its first
      # real run: 38/100 against a 40 threshold, a 2-point miss entirely
      # explained by shared-runner CPU variance compounding under Lighthouse's
      # 4x-slowdown simulation (this exact repo's local run scored 74, and
      # live strummy.online scored 56 — both comfortably clear 40). Lowering
      # the threshold further would only weaken the signal that does exist
      # (a11y/best-practices/SEO all pass reliably); this is the correct fix.
      - name: Run Lighthouse against the unauthenticated homepage
        continue-on-error: true
        run: npm run lighthouse:ci -- http://localhost:3000

      # Full axe-core ruleset against the same running server — broader than
      # Lighthouse's accessibility category, which only runs a subset. First
      # real run against this exact homepage found 9 genuine violations
      # (color-contrast x6, three landmark rules) — continue-on-error for the
      # same reason as Lighthouse above: this is the introduction of a brand
      # new check, and the point right now is visibility, not gating a merge
      # on pre-existing findings nobody has triaged yet. Flip to blocking once
      # someone has looked at a run's output and fixed or accepted the
      # current set.
      - name: axe-core accessibility scan
        continue-on-error: true
        run: npx @axe-core/cli http://localhost:3000 --exit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: lighthouse-ci-results.json
          retention-days: 14

  # Tags + GitHub Releases only — deliberately NO version-bump commit. The old
  # pipeline pushed "chore: bump version" commits to main; branch protection
  # now requires passing status checks on anything reaching main, and a commit
  # created inside this run cannot have them. Tags are outside branch
  # protection (no tag rules configured), so GITHUB_TOKEN suffices. Git tags
  # and Releases become the version truth; package.json's version field stays
  # frozen and means nothing (this app is not published to npm).
  #
  # Releases are cut on `production` ONLY, never on `main`.
  #
  # `main` is the STAGING branch: merging a feature PR there deploys to staging
  # and is not a release. A release is the `main` → `production` PR, so that PR's
  # body is the release notes — which means one release can cover several feature
  # PRs. Write it as a summary of the batch, not of a single change.
  #
  # Version derivation: PR labels version:major/minor/patch are explicit
  # overrides. Otherwise a release PR (head `main`) defaults to **minor**,
  # because a batch almost always contains at least one feature; a direct
  # hotfix branch onto production defaults to patch, and feature/* to minor.
  #
  # A push with no associated PR (fast-forward or an empty rebuild commit) still
  # cuts a release, using auto-generated notes from the commits since the last
  # tag — silence there would mean an untagged production deploy.
  release:
    name: Tag + GitHub Release
    needs: quality-gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Cut release from the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pr_json=$(gh api "repos/$REPO/commits/$SHA/pulls" -q '.[0] // empty')

          if [ -n "$pr_json" ]; then
            # PR title/body are untrusted text: keep them in files and jq, never
            # interpolate them into shell.
            echo "$pr_json" | jq -r '.title // ""' > /tmp/pr-title
            echo "$pr_json" | jq -r '.body // ""'  > /tmp/pr-body
            branch=$(echo "$pr_json" | jq -r '.head.ref // ""')
            number=$(echo "$pr_json" | jq -r '.number')
            labels=$(echo "$pr_json" | jq -r '[.labels[].name] | join(",")')
            autonotes=false
          else
            # Fast-forward or direct push to production: still a real release, so
            # tag it rather than going silent. Notes come from the commit log.
            echo "Release" > /tmp/pr-title
            : > /tmp/pr-body
            branch=main
            number=0
            labels=""
            autonotes=true
          fi

          prev=$(gh api "repos/$REPO/releases/latest" -q '.tag_name')
          ver=${prev#v}
          IFS=. read -r major minor patch <<< "$ver"

          case ",$labels," in
            *,version:major,*) bump=major ;;
            *,version:minor,*) bump=minor ;;
            *,version:patch,*) bump=patch ;;
            # `main` = the staging→production release PR: a batch, so minor.
            *) case "$branch" in main|feature/*|feat/*) bump=minor ;; *) bump=patch ;; esac ;;
          esac
          case "$bump" in
            major) next="v$((major+1)).0.0" ;;
            minor) next="v$major.$((minor+1)).0" ;;
            patch) next="v$major.$minor.$((patch+1))" ;;
          esac

          {
            cat /tmp/pr-body
            echo ""
            echo "---"
            echo "**Full Changelog**: https://github.com/$REPO/compare/$prev...$next"
          } > /tmp/notes.md

          # -R is required: this job runs WITHOUT a checkout (it needs no
          # code), and `gh release create` otherwise infers the repo from a
          # local git context that doesn't exist here. First live run failed
          # on exactly that ("not a git repository"); the gh api calls above
          # were immune because they name the repo in their paths.
          if [ "$autonotes" = true ]; then
            gh release create "$next" \
              -R "$REPO" \
              --target "$SHA" \
              --title "$next" \
              --generate-notes
            echo "## Released [$next](https://github.com/$REPO/releases/tag/$next) from a direct push to production (auto-generated notes, → $bump)" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$next" \
              -R "$REPO" \
              --target "$SHA" \
              --title "$next: $(cat /tmp/pr-title)" \
              --notes-file /tmp/notes.md
            echo "## Released [$next](https://github.com/$REPO/releases/tag/$next) from #$number (\`$branch\` → $bump)" >> "$GITHUB_STEP_SUMMARY"
          fi
