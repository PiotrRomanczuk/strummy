name: CI

# Cost discipline (a previous Actions setup ran up a $200+ bill):
#   - main and PRs targeting main ONLY — no feature/** or fix/** push triggers
#   - no `schedule:` in this file, ever. Scheduled production jobs belong in
#     cron-jobs.yml, which stays deleted until the app returns to remote prod.
#   - no matrix: one Node version, one OS
#   - one job, one runner, one `npm ci` — the previous pipeline fanned the same
#     install across three jobs and paid for it three times
#   - concurrency cancels superseded runs on rapid pushes
#   - a hard timeout so nothing can hang a runner for six hours
#
# ⚠ The `push` trigger below is close to dead in practice. auto-merge.yml merges
# with GITHUB_TOKEN as app/github-actions, and Actions' recursion guard means
# such pushes trigger NO workflow runs — so a normal bot-merged PR produces no
# post-merge CI run at all. Verified 2026-07-31: of the four most recent merges
# to main only #615 (human-merged) produced one. Vercel still deploys, because
# it uses its own GitHub App and is not subject to the guard.
#
# main's green is therefore inherited from PR-time checks. That is why main
# requires branches to be up to date before merging (branch protection,
# `strict: true`, set 2026-08-01) — it forces the PR to contain current main so
# the PR-time run actually tests what lands. Do not add a post-merge-only check
# here and assume it runs.
on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, types, tests, build
    # Self-hosted EliteDesk runner (label: e2e-light — see e2e.yml for the
    # two-runner setup on that box). Was ubuntu-latest, billing real Actions
    # minutes on every push; nothing this job does needs a hosted runner or a
    # live database (mock env below, SKIP_DB_TESTS on the test steps), so it
    # belongs next to detect/types-drift, not on GitHub's meter.
    #
    # This is a RE-APPLY: the first fix landed via PR #654, but GitHub's
    # squash-merge silently dropped this file's diff even though it was
    # present on the PR branch tip (verified directly: `git diff <squash
    # commit>^ <squash commit> -- .github/workflows/ci.yml` was empty, while
    # the same diff against the actual PR head commit was not). If this
    # reverts to ubuntu-latest again, check what the squash-merge actually
    # produced — don't assume the PR's file list matches what landed.
    runs-on: [self-hosted, e2e-light]
    timeout-minutes: 20
    # Version-bump commits change only package.json; re-running the suite for
    # them buys nothing. (head_commit is null on pull_request, so PRs always run.)
    if: "!startsWith(github.event.head_commit.message, 'chore: bump version')"

    env:
      # Fall back to inert placeholders so lint/typecheck/build never depend on
      # live credentials. Unit tests mock Supabase; anything needing a real
      # database is excluded via SKIP_DB_TESTS below.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-key' }}

    defaults:
      run:
        working-directory: quality-gates-check

    steps:
      # fetch-depth: 0 because the PR unit-test step uses --changedSince,
      # which needs the merge-base with origin/main. clean: false + its own
      # path: this is a persistent box (not an ephemeral hosted runner), so
      # node_modules/.next/eslint-and-tsc-incremental-state all survive
      # between runs for free — no actions/cache needed, matching rls/
      # db-parity's pattern rather than ci.yml's old hosted-runner one.
      - uses: actions/checkout@v6
        with:
          path: quality-gates-check
          fetch-depth: 0
          clean: false

      # node_modules persists on disk between runs; reinstall only when the
      # lockfile actually changed — same trick as rls's job in e2e.yml.
      - name: Install dependencies if the lockfile changed
        run: |
          HASH=$(md5sum package-lock.json | cut -d' ' -f1)
          if [ ! -f node_modules/.package-lock.json ] || [ "$(cat .quality-gates-lock-hash 2>/dev/null)" != "$HASH" ]; then
            npm ci
            echo "$HASH" > .quality-gates-lock-hash
          fi

      # Lint and type check are independent and each is effectively
      # single-threaded, so running them concurrently on this runner is free.
      # Deliberately NOT split into a second job: that would pay for another
      # checkout + `npm ci` in billed minutes, which is the exact fan-out the
      # cost note at the top of this file exists to prevent.
      #
      # Output goes to files and is replayed in collapsible groups afterwards —
      # interleaved stdout from two concurrent tools is unreadable, and a gate
      # whose failure you cannot attribute is barely a gate.
      # --cache-strategy content, not the default mtime: every checkout writes
      # fresh timestamps, so a metadata-keyed cache would never hit in CI.
      # tsc needs no flags — tsconfig.json already sets `incremental: true`,
      # which reads/writes tsconfig.tsbuildinfo (content-hashed, so it too
      # survives fresh checkouts).
      - name: Lint and type check (concurrent)
        id: checks
        run: |
          npm run lint -- --cache --cache-location .eslintcache --cache-strategy content > /tmp/lint.log 2>&1 & lint_pid=$!
          npm run typecheck > /tmp/tsc.log 2>&1 & tsc_pid=$!
          wait $lint_pid; lint_rc=$?
          wait $tsc_pid; tsc_rc=$?

          echo "::group::Lint output"; cat /tmp/lint.log; echo "::endgroup::"
          echo "::group::Type check output"; cat /tmp/tsc.log; echo "::endgroup::"

          [ $lint_rc -eq 0 ] || echo "::error title=Lint::eslint exited $lint_rc"
          [ $tsc_rc -eq 0 ] || echo "::error title=Type check::tsc exited $tsc_rc"
          # Explicit test rather than summing the codes: exit statuses are mod
          # 256, so two failures could sum to a deceptive 0.
          if [ $lint_rc -ne 0 ] || [ $tsc_rc -ne 0 ]; then exit 1; fi

      - name: Check project structure
        id: structure
        run: npm run check:structure:strict

      # Do NOT add --testPathIgnorePatterns to either step: the Jest CLI flag
      # REPLACES the config array rather than merging, which would wipe the
      # quarantine list in jest.config.ts and let rotted tests run.
      # (--maxWorkers is a scalar override and carries no such hazard.)
      #
      # Why two steps. Measured on run 30456166861: the suite took 390s of a
      # 624s job — 63% — while the identical 3,744 tests run in 17s locally.
      # Two causes, both addressed here:
      #   1. `--coverage` instruments every file and writes html + lcov +
      #      json-summary. PRs skip it; `main` still runs it, so the per-file
      #      100% locks on the core files are enforced before anything can
      #      regress there. TRADE-OFF: a coverage drop now surfaces on main
      #      rather than on the PR that caused it. Coverage failures don't
      #      break the app, and the alternative was paying ~6 min on every
      #      push — but if that lands too late for comfort, restore --coverage
      #      below with `--coverageReporters=text-summary`, which keeps the
      #      gate and drops only the expensive report writing.
      #   2. jest.config.ts sets `maxWorkers: '50%'`, tuned for an 8-core Mac.
      #      A hosted runner has 2-4 vCPUs, so 50% left Jest on one worker.
      # --changedSince=origin/main runs only the tests Jest's dependency graph
      # links (transitively) to the PR's diff — typically seconds instead of
      # ~50s. Two accepted gaps, both backstopped by the full suite + coverage
      # that still runs on every push to main:
      #   1. The graph tracks imports, not data: a test that fs.reads a
      #      fixture won't re-run when only the fixture changes.
      #   2. Zero affected tests is a clean pass by design ("No tests found
      #      related to changed files"), e.g. docs-only PRs.
      - name: Unit tests (pull request — affected by diff only)
        id: unit-pr
        if: github.event_name == 'pull_request'
        run: npx jest --ci --watchAll=false --maxWorkers=100% --changedSince=origin/main
        env:
          CI: true
          SKIP_DB_TESTS: true

      - name: Unit tests + coverage thresholds (main)
        id: unit-main
        if: github.event_name != 'pull_request'
        run: npm run test:ci -- --maxWorkers=100%
        env:
          CI: true
          SKIP_DB_TESTS: true

      - name: Integration tests
        id: integration
        run: npm run test:integration
        env:
          CI: true
          SKIP_DB_TESTS: true

      - name: Build
        id: build
        run: npm run build

      # One glance on the run's summary page instead of spelunking logs.
      # `steps.<id>.outcome` is the pre-continue-on-error result; a skipped
      # unit variant always means "the other event's variant ran", so it is
      # rendered as a dash rather than implying a gate was missed.
      - name: Write job summary
        if: always()
        run: |
          fmt() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "🚫";; *) echo "—";; esac; }
          {
            echo "## Quality gates"
            echo ""
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| Lint + type check | $(fmt '${{ steps.checks.outcome }}') |"
            echo "| Structure check | $(fmt '${{ steps.structure.outcome }}') |"
            echo "| Unit (PR, no coverage) | $(fmt '${{ steps.unit-pr.outcome }}') |"
            echo "| Unit + coverage (main) | $(fmt '${{ steps.unit-main.outcome }}') |"
            echo "| Integration | $(fmt '${{ steps.integration.outcome }}') |"
            echo "| Build | $(fmt '${{ steps.build.outcome }}') |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Tags + GitHub Releases only — deliberately NO version-bump commit. The old
  # pipeline pushed "chore: bump version" commits to main; branch protection
  # now requires passing status checks on anything reaching main, and a commit
  # created inside this run cannot have them. Tags are outside branch
  # protection (no tag rules configured), so GITHUB_TOKEN suffices. Git tags
  # and Releases become the version truth; package.json's version field stays
  # frozen and means nothing (this app is not published to npm).
  #
  # Releases are cut on `production` ONLY, never on `main`.
  #
  # `main` is the STAGING branch: merging a feature PR there deploys to staging
  # and is not a release. A release is the `main` → `production` PR, so that PR's
  # body is the release notes — which means one release can cover several feature
  # PRs. Write it as a summary of the batch, not of a single change.
  #
  # Version derivation: PR labels version:major/minor/patch are explicit
  # overrides. Otherwise a release PR (head `main`) defaults to **minor**,
  # because a batch almost always contains at least one feature; a direct
  # hotfix branch onto production defaults to patch, and feature/* to minor.
  #
  # A push with no associated PR (fast-forward or an empty rebuild commit) still
  # cuts a release, using auto-generated notes from the commits since the last
  # tag — silence there would mean an untagged production deploy.
  release:
    name: Tag + GitHub Release
    needs: quality-gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Cut release from the merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pr_json=$(gh api "repos/$REPO/commits/$SHA/pulls" -q '.[0] // empty')

          if [ -n "$pr_json" ]; then
            # PR title/body are untrusted text: keep them in files and jq, never
            # interpolate them into shell.
            echo "$pr_json" | jq -r '.title // ""' > /tmp/pr-title
            echo "$pr_json" | jq -r '.body // ""'  > /tmp/pr-body
            branch=$(echo "$pr_json" | jq -r '.head.ref // ""')
            number=$(echo "$pr_json" | jq -r '.number')
            labels=$(echo "$pr_json" | jq -r '[.labels[].name] | join(",")')
            autonotes=false
          else
            # Fast-forward or direct push to production: still a real release, so
            # tag it rather than going silent. Notes come from the commit log.
            echo "Release" > /tmp/pr-title
            : > /tmp/pr-body
            branch=main
            number=0
            labels=""
            autonotes=true
          fi

          prev=$(gh api "repos/$REPO/releases/latest" -q '.tag_name')
          ver=${prev#v}
          IFS=. read -r major minor patch <<< "$ver"

          case ",$labels," in
            *,version:major,*) bump=major ;;
            *,version:minor,*) bump=minor ;;
            *,version:patch,*) bump=patch ;;
            # `main` = the staging→production release PR: a batch, so minor.
            *) case "$branch" in main|feature/*|feat/*) bump=minor ;; *) bump=patch ;; esac ;;
          esac
          case "$bump" in
            major) next="v$((major+1)).0.0" ;;
            minor) next="v$major.$((minor+1)).0" ;;
            patch) next="v$major.$minor.$((patch+1))" ;;
          esac

          {
            cat /tmp/pr-body
            echo ""
            echo "---"
            echo "**Full Changelog**: https://github.com/$REPO/compare/$prev...$next"
          } > /tmp/notes.md

          # -R is required: this job runs WITHOUT a checkout (it needs no
          # code), and `gh release create` otherwise infers the repo from a
          # local git context that doesn't exist here. First live run failed
          # on exactly that ("not a git repository"); the gh api calls above
          # were immune because they name the repo in their paths.
          if [ "$autonotes" = true ]; then
            gh release create "$next" \
              -R "$REPO" \
              --target "$SHA" \
              --title "$next" \
              --generate-notes
            echo "## Released [$next](https://github.com/$REPO/releases/tag/$next) from a direct push to production (auto-generated notes, → $bump)" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$next" \
              -R "$REPO" \
              --target "$SHA" \
              --title "$next: $(cat /tmp/pr-title)" \
              --notes-file /tmp/notes.md
            echo "## Released [$next](https://github.com/$REPO/releases/tag/$next) from #$number (\`$branch\` → $bump)" >> "$GITHUB_STEP_SUMMARY"
          fi
